<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Miss Tokyo — You're Offline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #141210;
      color: #F7F2EC;
      font-family: Georgia, 'Times New Roman', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 32px 24px;
      text-align: center;
    }

    .icon {
      width: 64px;
      height: 64px;
      border: 1px solid #C9963A;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px;
      opacity: 0.7;
    }

    .icon svg {
      width: 28px;
      height: 28px;
      stroke: #C9963A;
    }

    h1 {
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #C9963A;
      margin-bottom: 16px;
      font-weight: 400;
    }

    .divider {
      width: 40px;
      height: 1px;
      background: rgba(201, 150, 58, 0.4);
      margin: 0 auto 20px;
    }

    p {
      color: #8C8479;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 0.875rem;
      letter-spacing: 0.08em;
      line-height: 1.7;
      max-width: 280px;
    }

    .retry-btn {
      margin-top: 36px;
      padding: 14px 32px;
      background: transparent;
      border: 1px solid rgba(201, 150, 58, 0.5);
      color: #C9963A;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .retry-btn:hover, .retry-btn:active {
      background: rgba(201, 150, 58, 0.08);
      border-color: #C9963A;
    }
  </style>
</head>
<body>
  <div class="icon">
    <!-- Wifi-off SVG icon -->
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="1" y1="1" x2="23" y2="23"/>
      <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
      <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
      <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
      <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
      <line x1="12" y1="20" x2="12.01" y2="20"/>
    </svg>
  </div>

  <h1>Miss Tokyo</h1>
  <div class="divider"></div>
  <p>You appear to be offline.<br/>Please check your connection and try again.</p>

  <button class="retry-btn" onclick="window.location.reload()">
    Try Again
  </button>
</body>
</html>
